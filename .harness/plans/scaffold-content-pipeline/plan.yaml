id: scaffold-content-pipeline
goal: >
  Loonaciaverse 개인 사이트의 .NET 10 솔루션 뼈대(Core, Web(Blazor WASM Standalone), ContentBuilder,
  테스트 프로젝트)와 콘텐츠 변환 파이프라인을 만든다. 완료 상태는 다음과 같다.
  저장소 루트에서 `dotnet build`를 실행하면 `content/`의 Markdown과 YAML(글, 프로젝트, About, site.yml, universe.yml)이
  `src/Loonaciaverse.Web/wwwroot/content/`의 JSON으로 변환되고, 같은 빌드에서 `wwwroot/feed.xml`, `sitemap.xml`,
  `robots.txt`도 생성된다. 초안, 검증 실패, 목차, 이미지 경로, HUD 스탯이 xUnit으로 검증된다.
  Web 앱은 `IContentService`의 HTTP 구현체로 이 JSON을 읽을 수 있다. 화면(UI), Three.js 씬, CI 배포는 이 계획의 범위가 아니다.
approved: true
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-web-skeleton
    title: Add solution, Blazor WASM web project and bUnit test project
    description: |
      먼저 읽을 파일: docs/ADR.md (ADR-001, ADR-004), docs/ARCHITECTURE.md ("디렉토리 구조", "레이어 규칙", "횡단 관심사"의 크기 항목).

      저장소에는 아직 코드가 없다. 이 스텝에서 다음을 만든다.
      1. `global.json`: `{"sdk": {"version": "10.0.100", "rollForward": "latestFeature"}}`. 이유: 이 PC에는 .NET 9와 10 SDK가 함께 설치되어 있어 10으로 고정해야 한다.
      2. 루트 솔루션: `dotnet new sln -n Loonaciaverse`(.NET 10 SDK에서는 `Loonaciaverse.slnx`가 생긴다). 루트에 솔루션 파일은 이것 하나만 둔다. 이유: 인수 조건이 루트에서 인자 없이 `dotnet build`/`dotnet test`를 실행한다.
      3. `src/Loonaciaverse.Web`: `dotnet new blazorwasm --empty`로 만든 Blazor WebAssembly Standalone 프로젝트(net10.0).
         - csproj에 `<InvariantGlobalization>true</InvariantGlobalization>`를 넣는다. 이유: 전송량 예산.
         - `Program.cs`는 top-level 문을 유지하되 서비스 등록을 `public partial class Program`의 정적 메서드
           `public static void ConfigureServices(IServiceCollection services, string baseAddress)`로 옮긴다.
           이 메서드는 `HttpClient`(BaseAddress = baseAddress)를 scoped로 등록한다. top-level 문은
           `ConfigureServices(builder.Services, builder.HostEnvironment.BaseAddress)`를 호출한다.
           이유: 나중에 BlazorWasmPreRendering.Build가 이름으로 이 메서드를 찾는다. 로컬 함수로 만들지 마라(리플렉션으로 찾을 수 없다).
         - `HeadOutlet`을 `head::after`에 등록한다(템플릿에 없으면 추가).
         - `Pages/Home.razor`(`@page "/"`)는 `<PageTitle>LOONACIAVERSE</PageTitle>`와 `<h1>LOONACIAVERSE</h1>`만 렌더링한다.
         - 템플릿의 샘플 페이지, 샘플 데이터(weather 등), 부트스트랩 같은 샘플 CSS 라이브러리가 있으면 지운다.
      4. `tests/Loonaciaverse.Web.Tests`: xUnit 테스트 프로젝트(`dotnet new xunit`) + bUnit 최신 안정 버전, Web 프로젝트 참조.
         Home이 `LOONACIAVERSE` 텍스트의 h1을 렌더링하는지 검증하는 테스트 하나를 만든다.
      5. 두 프로젝트를 솔루션에 추가한다.
      6. 루트 `.gitignore`: `bin/`, `obj/`, `.vs/`, `*.user`, `TestResults/`, `node_modules/`, 그리고 이후 스텝의 빌드 산출물
         `src/Loonaciaverse.Web/wwwroot/content/`, `src/Loonaciaverse.Web/wwwroot/js/`,
         `src/Loonaciaverse.Web/wwwroot/feed.xml`, `src/Loonaciaverse.Web/wwwroot/sitemap.xml`, `src/Loonaciaverse.Web/wwwroot/robots.txt`.
         `.harness/.gitignore`는 건드리지 마라.

      Core, ContentBuilder 프로젝트는 만들지 마라. 이유: 실제 코드와 함께 스텝 s2에서 만든다.
      UI 스타일, 레이아웃 꾸미기, CSS를 추가하지 마라. 이유: 이 계획의 범위 밖이다.
    expected_files:
      - global.json
      - .gitignore
      - Loonaciaverse.slnx
      - src/Loonaciaverse.Web/*
      - tests/Loonaciaverse.Web.Tests/*
    ac:
      - dotnet build
      - dotnet test

  - id: s2-content-builder-cli
    title: Add Core library and ContentBuilder CLI with front matter reader
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("레이어 규칙", "콘텐츠 모델 (Core)", "빌드 산출물"), docs/ADR.md (ADR-002, ADR-004), Loonaciaverse.slnx.

      1. `src/Loonaciaverse.Core`: net10.0 클래스 라이브러리. NuGet 패키지 참조를 하나도 넣지 마라. 이유: Core는 의존성이 없어야 한다(ADR-004).
         - `Content/ContentJson.cs`: `public static class ContentJson { public static JsonSerializerOptions Options { get; } }`.
           `JsonSerializerDefaults.Web`(camelCase) 기반, `WriteIndented = false`. 빌더와 웹이 모두 이 옵션을 쓴다.
         - 템플릿의 `Class1.cs`는 지운다.
      2. `tools/Loonaciaverse.ContentBuilder`: net10.0 콘솔 앱. Core를 참조하고 Markdig, YamlDotNet 최신 안정 버전을 참조한다.
         - `BuildOptions`: `public sealed record BuildOptions(string ContentDir, string OutputDir, bool IncludeDrafts)`.
         - `BuildResult`: `public sealed record BuildResult(IReadOnlyList<string> Errors) { public bool Success => Errors.Count == 0; }`.
         - `ContentBuildRunner`: `public static BuildResult Run(BuildOptions options)`.
           이 스텝에서는 다음만 한다.
           (a) `ContentDir`가 없으면 에러를 반환한다.
           (b) `{OutputDir}/content/` 디렉토리를 지우고 새로 만든다. 이유: 지운 글의 JSON이 남지 않게 한다.
           `OutputDir` 자체나 그 안의 다른 파일은 지우지 마라.
         - `FrontMatterReader`: `public static FrontMatterDocument<T> Read<T>(string markdown, string sourcePath)`.
           `FrontMatterDocument<T>`는 `(T Data, string Body)` record다.
           Markdig의 YAML front matter 확장으로 `---` 블록을 찾고 YamlDotNet(CamelCaseNamingConvention, 모르는 키는 무시)으로 `T`를 역직렬화한다.
           `Body`는 front matter를 뺀 Markdown 본문이다.
           front matter가 없거나 YAML이 잘못되면 `ContentValidationException`(메시지 형식: `{sourcePath}: {설명}`)을 던진다.
         - `Program.cs`: 인자 `--content <dir> --output <dir> [--include-drafts]`를 파싱해 `ContentBuildRunner.Run`을 호출한다.
           성공하면 0으로 끝난다. 실패하면 에러를 한 줄씩 stderr에 쓰고 1로 끝난다.
           인자가 잘못되면 사용법을 stderr에 쓰고 2로 끝난다. 인자 파싱 라이브러리를 추가하지 마라. 이유: 인자가 세 개뿐이다.
      3. `tests/Loonaciaverse.ContentBuilder.Tests`: xUnit 프로젝트, ContentBuilder 참조.
         테스트는 임시 디렉토리에 파일을 만들어 검증하고 끝나면 지운다. 다음을 검증한다.
         - FrontMatterReader가 문자열, 날짜, 리스트 필드를 읽고 본문을 분리한다.
         - front matter가 없으면 경로가 들어간 예외가 난다.
         - Runner가 없는 ContentDir에서 실패한다.
         - Runner가 `{OutputDir}/content/` 안의 오래된 파일을 지우되, `OutputDir`의 다른 파일은 남긴다.
      4. 두 프로젝트를 솔루션에 추가한다.

      글, 프로젝트 같은 콘텐츠 변환은 아직 하지 마라. 이유: s3부터 종류별로 추가한다.
      Web 프로젝트가 ContentBuilder를 실행하게 하지 마라. 이유: s9에서 연결한다.
    expected_files:
      - Loonaciaverse.slnx
      - src/Loonaciaverse.Core/*
      - tools/Loonaciaverse.ContentBuilder/*
      - tests/Loonaciaverse.ContentBuilder.Tests/*
    ac:
      - dotnet build
      - dotnet test

  - id: s3-posts-happy-path
    title: Convert blog posts to index and detail JSON
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("콘텐츠 모델 (Core)", "빌드 산출물"), tools/Loonaciaverse.ContentBuilder의 ContentBuildRunner.cs와 FrontMatterReader.cs, src/Loonaciaverse.Core/Content/ContentJson.cs.

      `content/posts/{slug}/index.md`를 JSON으로 변환한다.
      1. Core `Content/Posts.cs`:
         - `public sealed record PostSummary(string Slug, string Title, DateOnly Date, DateOnly? Updated, string Summary, IReadOnlyList<string> Tags, bool Draft, string? Cover)`
         - `public sealed record PostDetail(PostSummary Meta, string Html)`
         JSON의 날짜는 `yyyy-MM-dd` 문자열이다(System.Text.Json의 DateOnly 기본 형식).
      2. ContentBuilder `PostBuilder`: `content/posts/*/index.md`를 모두 읽는다.
         front matter 필드는 `title`, `slug`, `date`, `updated`, `summary`, `tags`, `draft`, `cover`다.
         본문은 Markdig(`UseAdvancedExtensions()`, YAML front matter 확장)로 HTML로 바꾼다. raw HTML(iframe 등)은 그대로 둔다.
         출력:
         - `{OutputDir}/content/posts.json`: `PostSummary` 배열, Date 내림차순(같으면 Slug 오름차순)
         - `{OutputDir}/content/posts/{slug}.json`: `PostDetail`
         직렬화는 반드시 `ContentJson.Options`를 쓴다.
         `content/posts` 디렉토리가 없으면 빈 배열을 쓴다.
      3. `ContentBuildRunner.Run`이 PostBuilder를 호출한다. 이 스텝에서는 `draft` 값을 읽어 그대로 담기만 하고 제외하지 않는다.
      4. 샘플 글 `content/posts/hello-loonaciaverse/index.md`를 만든다.
         - 한국어 본문, `##` 헤딩 두 개, 그 아래 `###` 하나, ```csharp 코드 블록 하나를 넣는다.
         - front matter: title "Loonaciaverse에 오신 것을 환영합니다", slug hello-loonaciaverse, date 2026-10-26, summary 한 줄, tags [blazor, threejs].
      5. 테스트: 글 두 개로 정렬, 필드 매핑, HTML 변환(코드 블록에 `language-csharp` 클래스), 상세 JSON 파일 생성을 검증한다.
         `ContentJson.Options`로 역직렬화한 결과가 원래 값과 같아야 한다.

      검증(필수 필드, slug 형식), 초안 제외, 목차, 이미지 처리는 하지 마라. 이유: s4, s5에서 테스트와 함께 추가한다.
    expected_files:
      - src/Loonaciaverse.Core/Content/Posts.cs
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
      - content/posts/hello-loonaciaverse/index.md
    ac:
      - dotnet build
      - dotnet test

  - id: s4-posts-validation-drafts
    title: Validate post front matter and handle drafts
    description: |
      먼저 읽을 파일: tools/Loonaciaverse.ContentBuilder의 PostBuilder.cs, ContentBuildRunner.cs, FrontMatterReader.cs, Program.cs, docs/PRD.md ("6. 콘텐츠 파이프라인" 완료 판정 기준).

      1. 검증 규칙. 위반마다 에러를 하나씩 모으고, 메시지 형식은 `{content 기준 상대 경로}: {설명}`이다.
         - 필수 필드: `title`, `slug`, `date`, `summary`. 비어 있으면 에러.
         - `slug`는 `^[a-z0-9]+(-[a-z0-9]+)*$` 형식이어야 하고, 글 폴더 이름과 같아야 한다. 이유: 이미지 경로와 URL이 폴더 이름에 의존한다.
         - slug 중복은 에러다(두 파일 경로를 모두 메시지에 넣는다).
         - 각 태그도 slug와 같은 형식이어야 한다. 이유: 태그가 `/blog/tags/{tag}` URL이 된다.
         - `updated`가 있으면 `date` 이상이어야 한다.
         - 검증 규칙은 s6에서 프로젝트에도 재사용할 수 있게 별도 클래스(예: `ContentValidator`)로 둔다.
      2. 에러가 하나라도 있으면 `BuildResult.Errors`로 모두 반환한다. 일부만 성공한 출력을 남기지 마라(`{OutputDir}/content/`를 비운 상태로 둔다).
         `Program`은 기존 규칙대로 stderr 출력 후 1로 끝난다.
         `ContentValidationException`(front matter 파싱 실패)도 예외를 터뜨리지 말고 같은 에러 목록에 넣는다.
      3. 초안: `draft: true`인 글은 `BuildOptions.IncludeDrafts`가 false이면 `posts.json`과 상세 파일 모두에서 뺀다. true이면 `Draft = true`로 포함한다.
         초안도 검증은 똑같이 받는다.
      4. 테스트: 규칙마다 실패 케이스 하나 이상, 에러 여러 개가 한 번에 모이는지, 초안 포함·제외 두 경우,
         실패 시 출력 디렉토리에 posts.json이 없는지 검증한다.

      목차, 이미지 처리는 하지 마라. 이유: s5에서 추가한다.
    expected_files:
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
    ac:
      - dotnet build
      - dotnet test

  - id: s5-posts-toc-images
    title: Add table of contents and post asset handling
    description: |
      먼저 읽을 파일: tools/Loonaciaverse.ContentBuilder의 PostBuilder.cs, src/Loonaciaverse.Core/Content/Posts.cs, docs/UX.md ("6. 상세 페이지 공통", "7. 페이지별"의 글 상세).

      1. 목차:
         - Core에 `public sealed record TocEntry(int Level, string Id, string Text)`를 추가하고, `PostDetail`에 `IReadOnlyList<TocEntry> Toc`를 추가한다.
         - 본문의 `##`(Level 2), `###`(Level 3) 헤딩만 문서 순서대로 담는다.
         - 렌더된 HTML의 헤딩 `id`와 `TocEntry.Id`가 같아야 한다.
         - 한글 헤딩도 비어 있지 않은 id를 가져야 하고, 같은 텍스트의 헤딩이 둘이면 id가 서로 달라야 한다(Markdig AutoIdentifiers의 GitHub 방식 등 사용).
      2. 이미지와 첨부:
         - 글 폴더의 `index.md` 이외 파일을 모두 `{OutputDir}/content/posts/{slug}/`로 복사한다(하위 폴더 구조 유지).
         - 본문의 상대 경로 이미지·링크 URL(스킴 없음, `/`나 `#`로 시작하지 않음)은 `/content/posts/{slug}/{경로}`로 바꾼다. Markdig AST에서 렌더 전에 바꾸고, 정규식으로 HTML을 고치지 마라. 이유: 코드 블록 안의 텍스트까지 바뀐다.
         - front matter의 `cover`도 같은 규칙으로 바꾼다.
         - `cover`가 가리키는 파일이 글 폴더에 없으면 검증 에러다(s4의 에러 형식).
         - 절대 URL(`https://…`)은 그대로 둔다.
         - 이미지·링크 경로 재작성은 s6에서 프로젝트에도 재사용할 수 있게 분리한다.
      3. 샘플 글 `content/posts/hello-loonaciaverse/`에 작은 SVG 이미지(`orbit.svg`, 직접 작성한 간단한 원 몇 개) 하나를 추가하고 본문에서 `![orbit](orbit.svg)`로 참조한다.
      4. 테스트: 목차 순서와 레벨, 한글·중복 헤딩 id, HTML id와 Toc id 일치, 이미지 복사, URL 재작성(상대/절대/코드 블록 안 텍스트 불변), 없는 cover 에러를 검증한다.
    expected_files:
      - src/Loonaciaverse.Core/Content/Posts.cs
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
      - content/posts/hello-loonaciaverse/*
    ac:
      - dotnet build
      - dotnet test

  - id: s6-projects-about
    title: Convert projects and about page
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("콘텐츠 모델 (Core)", "빌드 산출물"), docs/UX.md ("7. 페이지별"의 프로젝트와 About),
      tools/Loonaciaverse.ContentBuilder의 PostBuilder.cs와 s4·s5에서 분리한 검증·경로 재작성 클래스.

      1. Core `Content/Projects.cs`:
         - `public sealed record ProjectSummary(string Slug, string Title, string Summary, string Period, string Role, IReadOnlyList<string> Stack, IReadOnlyDictionary<string, string> Links, string? Thumbnail, bool Featured, int Order, bool Draft)`
         - `public sealed record ProjectDetail(ProjectSummary Meta, string Html)`
      2. Core `Content/About.cs`:
         - `public sealed record AboutProfile(string Name, string Title, IReadOnlyList<string> Stack, string Email, string? Github, string? Linkedin, string Html)`
      3. ContentBuilder에 `ProjectBuilder`를 추가한다.
         - 입력은 `content/projects/{slug}/index.md`, 출력은 `content/projects.json`과 `content/projects/{slug}.json`이다.
         - 정렬: Featured 먼저, 그다음 Order 오름차순, 그다음 Title 오름차순.
         - 필수 필드: title, slug, summary, period, role. slug 규칙, 폴더 이름 일치, 중복 검사, 초안 처리, 이미지 복사, 경로 재작성(`/content/projects/{slug}/…`, thumbnail 포함)은 글과 같다.
         - s4·s5의 클래스를 재사용하고, 같은 로직을 복사해 두 벌 만들지 마라.
      4. ContentBuilder에 `AboutBuilder`를 추가한다.
         - 입력은 `content/about.md`, 출력은 `content/about.json`이다.
         - 필수 필드: name, title, email. 파일이 없으면 에러다.
      5. `ContentBuildRunner.Run`이 세 빌더를 모두 실행하고 에러를 한 목록으로 합친다. 에러가 있으면 출력을 남기지 않는 기존 규칙을 유지한다.
      6. 샘플 콘텐츠를 만든다.
         - `content/projects/loonaciaverse/index.md`: 이 사이트 자체. featured: true, order: 1, stack [csharp, blazor, threejs], links에 github 키.
           본문은 "개요/문제와 해결/결과" `##` 헤딩 세 개로 쓴다.
         - `content/about.md`: name "LOONACIA", title "Game & .NET Developer", stack [csharp, dotnet, unity], email "you@example.com",
           github "https://github.com/", linkedin "https://www.linkedin.com/", 한국어 소개 한 문단.
           email과 URL은 사용자가 나중에 바꿀 자리표시자다.
      7. 테스트: 프로젝트 정렬, 필드 매핑, 프로젝트 검증과 초안, about 필수 필드, about 파일 누락 에러, 세 종류 에러가 한 목록에 모이는지 검증한다.
    expected_files:
      - src/Loonaciaverse.Core/Content/Projects.cs
      - src/Loonaciaverse.Core/Content/About.cs
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
      - content/projects/loonaciaverse/*
      - content/about.md
    ac:
      - dotnet build
      - dotnet test

  - id: s7-universe-stats
    title: Build universe JSON with site info, bodies and HUD stats
    description: |
      먼저 읽을 파일: docs/UX.md ("4.1 천체", "4.7 HUD 내용"), docs/ARCHITECTURE.md ("콘텐츠 모델 (Core)", "빌드 산출물"), ContentBuildRunner.cs, ProjectBuilder.cs, PostBuilder.cs.

      1. Core `Content/Universe.cs`:
         - `public sealed record SiteInfo(string Title, string BaseUrl, string Author, string Description)`
         - `public sealed record BodyVisual(string BaseColor, string AtmosphereColor, double NoiseScale, double GlowIntensity)`
         - `public sealed record BodyOrbit(double Radius, double PeriodSeconds, double Phase)`
         - `public sealed record CelestialBody(string Id, string Name, string Subtitle, string Tagline, string? Route, bool Locked, BodyVisual Visual, BodyOrbit? Orbit)`
         - `public sealed record BlogStats(int PostCount, DateOnly? LastPublished, IReadOnlyList<string> TopTags, PostSummary? Latest)`
         - `public sealed record ProjectStats(int ProjectCount, IReadOnlyList<string> TopStack, ProjectSummary? Featured)`
         - `public sealed record AboutStats(string Title, IReadOnlyList<string> Stack, string Email, string? Github, string? Linkedin)`
         - `public sealed record HudStats(BlogStats Blog, ProjectStats Projects, AboutStats About)`
         - `public sealed record Universe(SiteInfo Site, IReadOnlyList<CelestialBody> Bodies, HudStats Stats)`
      2. ContentBuilder에 `UniverseBuilder`를 추가한다. 입력은 `content/site.yml`과 `content/universe.yml`(최상위 키 `bodies` 리스트)이고, 출력은 `content/universe.json`이다.
         - 검증:
           - site.yml의 title, baseUrl, author, description은 필수이고, baseUrl은 절대 http(s) URL이어야 한다.
           - bodies의 id는 정확히 `about`, `projects`, `blog`, `playground` 네 개여야 한다(누락, 중복, 미지 id는 에러).
           - locked가 아닌 천체는 route가 필수다.
           - `about`만 orbit이 없고(항성), 나머지는 orbit이 필수다.
         - 스탯은 이번 빌드에서 실제로 출력되는 글과 프로젝트 기준으로 계산한다(초안 포함 여부는 BuildOptions를 따른다).
           - Blog: PostCount, LastPublished = 최신 Date, TopTags = 빈도 상위 3개(같으면 이름 오름차순), Latest = 최신 글.
           - Projects: ProjectCount, TopStack = stack 빈도 상위 3개(같으면 이름 오름차순), Featured = 정렬 순서상 첫 번째 Featured 프로젝트(없으면 null).
           - About: about.md에서 가져온다.
         - 스탯 계산은 YAML 파싱과 분리된 순수 함수로 만들어 단위 테스트한다.
      3. `ContentBuildRunner.Run`이 UniverseBuilder를 마지막에 실행한다. 에러 규칙은 기존과 같다.
      4. 샘플 파일을 만든다.
         - `content/site.yml`: title "LOONACIAVERSE", baseUrl "https://example.com", author "LOONACIA", description 한국어 한 줄.
           baseUrl 위에 `# 보유 도메인으로 교체` 주석을 단다.
         - `content/universe.yml`: 아래 네 천체. 이름은 임시다. tagline은 한국어 한 줄, visual과 orbit은 그럴듯한 숫자와 `#rrggbb` 색이면 된다.
           - about: LOONACIA / ABOUT / route /about / orbit 없음
           - projects: ARTIFEX / PROJECTS / route /projects
           - blog: ARCHIVA / BLOG / route /blog
           - playground: ARCADIA / PLAYGROUND / locked true / route 없음
      5. 테스트: 정상 변환, 각 검증 규칙의 실패, TopTags·TopStack의 동점 정렬, Featured 선택, 글·프로젝트가 0개일 때 스탯(LastPublished·Latest·Featured가 null)을 검증한다.
    expected_files:
      - src/Loonaciaverse.Core/Content/Universe.cs
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
      - content/site.yml
      - content/universe.yml
    ac:
      - dotnet build
      - dotnet test

  - id: s8-feed-sitemap-robots
    title: Generate RSS feed, sitemap and robots.txt
    description: |
      먼저 읽을 파일: docs/PRD.md ("3. 블로그", "6. 콘텐츠 파이프라인", "제약"의 URL 영속성), docs/UX.md ("2. 화면과 라우트"), ContentBuildRunner.cs, UniverseBuilder.cs(SiteInfo 읽는 부분).

      ContentBuilder에 `SeoBuilder`(또는 `FeedBuilder`와 `SitemapBuilder` 두 클래스)를 추가한다. 출력 위치는 `{OutputDir}/content/` 안이 아니라 `{OutputDir}` 바로 아래다.
      - URL은 모두 site.yml의 baseUrl(끝의 `/`는 정규화)로 만든 절대 URL이다.
      - 초안은 `IncludeDrafts`와 상관없이 항상 뺀다. 이유: 로컬 Debug 빌드 결과가 실수로 배포돼도 초안이 피드에 실리면 안 된다.
      1. `feed.xml`: RSS 2.0.
         - channel: title, link, description, language `ko`.
         - item(날짜 내림차순): title, link `{baseUrl}/blog/{slug}`, guid(같은 URL, isPermaLink true), pubDate(RFC 1123, 해당 날짜 00:00 UTC), description(summary), 태그마다 category.
         - XML은 `XmlWriter`나 `XDocument`로 만들고 문자열 이어 붙이기로 만들지 마라. 이유: 이스케이프 오류.
      2. `sitemap.xml`: sitemaps.org 0.9 형식.
         - `/`, `/projects`, `/blog`, `/about`, 모든 글 `/blog/{slug}`(lastmod = updated ?? date), 모든 프로젝트 `/projects/{slug}`, 글에 쓰인 모든 태그 `/blog/tags/{tag}`.
      3. `robots.txt`: `User-agent: *`, `Allow: /`, `Sitemap: {baseUrl}/sitemap.xml`.
      4. 이전 빌드가 남긴 세 파일은 새로 덮어쓴다. 빌드가 실패하면 세 파일을 지워 일부만 성공한 상태를 남기지 않는다.
         이 세 파일 말고 `{OutputDir}`의 다른 파일은 건드리지 마라.
      5. 테스트: 생성된 XML을 파싱해 item 순서·필드, 초안 제외(IncludeDrafts=true여도), 절대 URL과 baseUrl 정규화, sitemap URL 목록, robots 내용, 실패 시 파일 삭제를 검증한다.
    expected_files:
      - tools/Loonaciaverse.ContentBuilder/*.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/*.cs
    ac:
      - dotnet build
      - dotnet test

  - id: s9-msbuild-integration
    title: Run ContentBuilder as part of the web project build
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("데이터 흐름"의 빌드 절), docs/ADR.md (ADR-005), src/Loonaciaverse.Web/Loonaciaverse.Web.csproj, tools/Loonaciaverse.ContentBuilder/Program.cs, .gitignore.

      `dotnet build`(Web 프로젝트를 포함하는 빌드)가 ContentBuilder를 실행해 `src/Loonaciaverse.Web/wwwroot/`에 콘텐츠를 만들게 한다.
      1. Web csproj에 다음을 넣는다.
         - ContentBuilder를 먼저 빌드한다. `ProjectReference`(`ReferenceOutputAssembly="false"`) 또는 MSBuild 태스크로 빌드하고, 결과 dll 경로를 얻는다.
           Web의 RuntimeIdentifier(browser-wasm)가 ContentBuilder 빌드에 흘러가면 안 된다. 필요하면 `GlobalPropertiesToRemove`나 `SetTargetFramework`/`SkipGetTargetFrameworkProperties`를 쓴다.
         - 빌드 전 타깃이 `dotnet "<ContentBuilder.dll>" --content "<repo>/content" --output "<Web>/wwwroot"`를 `Exec`로 실행한다.
           `Configuration`이 `Debug`일 때만 `--include-drafts`를 붙인다. 종료 코드가 0이 아니면 빌드가 실패해야 한다(ContentBuilder의 stderr가 빌드 출력에 보여야 한다).
         - `dotnet run --project`로 실행하지 마라. 이유: 같은 빌드 안에서 Core를 동시에 빌드하다 파일 잠금이 생긴다.
         - 증분 빌드: `content/**`와 ContentBuilder dll을 Inputs, `$(IntermediateOutputPath)` 아래 stamp 파일을 Outputs로 둔다. 변경이 없으면 건너뛴다.
         - `dotnet watch`가 감지하도록 `content/**`를 `Watch` 항목으로 추가한다.
         - 생성된 `wwwroot/content/**`, `feed.xml`, `sitemap.xml`, `robots.txt`가 publish 출력에 포함되게 한다(빌드 전에 생성되므로 보통 자동 포함되지만, 첫 빌드에서도 포함되는지 확인한다).
      2. `tests/Loonaciaverse.Web.Tests`에 통합 테스트를 추가한다.
         - 저장소 루트(`global.json`이 있는 디렉토리)를 테스트 실행 위치에서 위로 찾아 올라가 찾는다.
         - `src/Loonaciaverse.Web/wwwroot/content/universe.json`, `posts.json`, `projects.json`, `about.json`과 `wwwroot/feed.xml`, `sitemap.xml`, `robots.txt`가 존재하는지 확인한다.
         - JSON은 `ContentJson.Options`로 Core 모델(`Universe`, `PostSummary[]`, `ProjectSummary[]`, `AboutProfile`)에 역직렬화되는지 검증한다.
         - 샘플 글 `hello-loonaciaverse`가 들어 있는지도 확인한다.
         - Web.Tests가 Core를 참조해야 하면 프로젝트 참조를 추가한다.
      3. 빌드 산출물이 `git status`에 나오지 않는지 확인한다. 나오면 `.gitignore`에 그 산출물만 덮는 패턴을 추가한다.
      4. docs/ARCHITECTURE.md "데이터 흐름"의 빌드 절이 실제 구현(ProjectReference 방식인지 MSBuild 태스크 방식인지, stamp 위치)과 다르면 그 절만 고친다.

      Vite/npm 빌드 타깃은 추가하지 마라. 이유: `scene/` 프로젝트는 다음 계획에서 만든다.
    expected_files:
      - src/Loonaciaverse.Web/Loonaciaverse.Web.csproj
      - tests/Loonaciaverse.Web.Tests/*
      - .gitignore
      - docs/ARCHITECTURE.md
    ac:
      - dotnet build
      - dotnet test

  - id: s10-http-content-service
    title: Add IContentService and HTTP implementation for the web app
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("레이어 규칙", "콘텐츠 모델 (Core)", "빌드 산출물"), docs/ADR.md (ADR-004),
      src/Loonaciaverse.Core/Content/*.cs, src/Loonaciaverse.Web/Program.cs.

      1. Core `Content/IContentService.cs`:
         ```csharp
         public interface IContentService
         {
             Task<Universe> GetUniverseAsync(CancellationToken cancellationToken = default);
             Task<IReadOnlyList<PostSummary>> GetPostsAsync(CancellationToken cancellationToken = default);
             Task<PostDetail?> GetPostAsync(string slug, CancellationToken cancellationToken = default);
             Task<IReadOnlyList<ProjectSummary>> GetProjectsAsync(CancellationToken cancellationToken = default);
             Task<ProjectDetail?> GetProjectAsync(string slug, CancellationToken cancellationToken = default);
             Task<AboutProfile> GetAboutAsync(CancellationToken cancellationToken = default);
         }
         ```
      2. Web `Services/HttpContentService.cs`: `IContentService`의 구현체로, 생성자에서 `HttpClient`를 받는다.
         - 요청 경로는 상대 경로 `content/universe.json`, `content/posts.json`, `content/posts/{slug}.json`, `content/projects.json`, `content/projects/{slug}.json`, `content/about.json`이다.
         - 역직렬화는 `ContentJson.Options`로 한다.
         - 상세 조회에서 slug가 `^[a-z0-9]+(-[a-z0-9]+)*$` 형식이 아니면 요청하지 않고 null을 반환한다. 이유: `../` 같은 경로 조작을 막는다.
         - 상세 조회가 404이면 null을 반환한다. 그 밖의 실패 상태 코드는 `HttpRequestException`을 그대로 던진다. 이유: 이후 UI가 SIGNAL LOST 화면을 띄우는 근거가 된다.
         - 캐싱을 넣지 마라. 이유: 필요성이 확인되지 않았다.
      3. `Program.ConfigureServices`에 `IContentService` → `HttpContentService`를 scoped로 등록한다. Web이 Core를 참조하지 않으면 프로젝트 참조를 추가한다.
      4. Web.Tests에 테스트를 추가한다. 가짜 `HttpMessageHandler`로 다음을 검증한다.
         - 각 메서드가 올바른 경로를 요청하고 역직렬화한다.
         - 잘못된 slug는 요청 없이 null이다.
         - 404는 null이다.
         - 500은 예외다.
         - DI 컨테이너(ConfigureServices로 구성)에서 `IContentService`를 꺼낼 수 있다.

      페이지나 컴포넌트에서 이 서비스를 쓰는 UI를 만들지 마라. 이유: 화면은 다음 계획의 범위다.
    expected_files:
      - src/Loonaciaverse.Core/Content/IContentService.cs
      - src/Loonaciaverse.Web/Services/HttpContentService.cs
      - src/Loonaciaverse.Web/Program.cs
      - src/Loonaciaverse.Web/Loonaciaverse.Web.csproj
      - tests/Loonaciaverse.Web.Tests/*
    ac:
      - dotnet build
      - dotnet test
