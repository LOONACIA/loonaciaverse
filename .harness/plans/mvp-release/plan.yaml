id: mvp-release
goal: >
  Loonaciaverse MVP의 남은 PRD 항목을 끝내 출시할 수 있는 상태로 만든다. 완료 상태는 다음과 같다.
  글과 프로젝트 본문의 YouTube 링크가 youtube-nocookie.com iframe으로 변환되고 16:9 반응형으로 보인다.
  index.html에 사이트 공통 OG 태그와 1200×630 기본 OG 이미지(임시, 사이트 주인이 교체)가 있고, 테스트가 OG 값과 content/site.yml의 일치를 검사한다.
  wwwroot/staticwebapp.config.json이 SPA 대체 경로, 정적 파일 제외, /content/* no-cache를 설정한다.
  tools/Loonaciaverse.BudgetCheck가 Release publish 결과에서 홈 첫 방문 전송량(Brotli 기준)을 계산하고 3MB를 넘으면 실패한다.
  .github/workflows/ci.yml이 PR에서는 테스트만, main 푸시에서는 테스트, publish, 예산 검사, Azure Static Web Apps 배포를 실행한다.
  docs가 실제 구현과 Azure·도메인 수동 설정 절차를 반영한다.
  Azure 리소스 생성, 배포 토큰 등록, 도메인 연결 같은 저장소 밖의 작업은 이 계획의 범위가 아니다(문서로만 안내한다).
approved: true
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-youtube-embed
    title: embed YouTube videos through youtube-nocookie at 16:9
    type: feat
    scope: builder
    description: |
      먼저 읽을 파일: docs/PRD.md ("2. 프로젝트 목록·상세"), docs/UX.md ("6. 상세 페이지 공통"의 본문),
      tools/Loonaciaverse.ContentBuilder/PostBuilder.cs, ProjectBuilder.cs, AboutBuilder.cs,
      tests/Loonaciaverse.ContentBuilder.Tests/ProjectBuilderTests.cs와 ContentTestData.cs (테스트 데이터 작성과 `CreateOptions` 패턴),
      src/Loonaciaverse.Web/wwwroot/css/app.css (`.prose` 규칙), tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs.

      현재 동작: 세 빌더의 Markdig 파이프라인은 `UseAdvancedExtensions()`에 들어 있는 MediaLinks 확장 때문에
      본문의 `![제목](https://www.youtube.com/watch?v=ID)`와 `![제목](https://youtu.be/ID)`를
      `<iframe src="https://www.youtube.com/embed/ID" class="youtube" width="500" height="281" frameborder="0" allowfullscreen="">`로 바꾼다.
      이 스텝은 도메인을 youtube-nocookie.com으로 바꾸고 16:9 반응형으로 보이게 한다.

      1. tools/Loonaciaverse.ContentBuilder/MediaEmbeds.cs를 추가한다.
         `public static class MediaEmbeds`에 `public static MarkdownPipelineBuilder UseNoCookieMediaLinks(this MarkdownPipelineBuilder builder)`.
         - `new MediaOptions()`의 기본 `Hosts` 가운데 `Class`가 `youtube`로 시작하는 provider(youtube, youtubeshort)를 감싼다.
           감싼 provider는 원래 provider가 만든 iframe URL에서 `https://www.youtube.com/embed/` 접두사를 `https://www.youtube-nocookie.com/embed/`로 바꾼다.
           `Class`와 `AllowFullScreen`은 원래 값을 그대로 쓴다. 다른 host(vimeo 등)는 그대로 둔다.
         - `builder.UseMediaLinks(options)`로 등록한다. 이 메서드는 `UseAdvancedExtensions()`보다 먼저 호출해야 한다.
           이유: Markdig는 이미 등록된 확장을 다시 추가하지 않으므로, 먼저 등록한 옵션이 쓰인다.
      2. PostBuilder, ProjectBuilder, AboutBuilder의 `Pipeline` 필드에서 `UseAdvancedExtensions()` 바로 앞에 `.UseNoCookieMediaLinks()`를 넣는다.
         PostBuilder의 `UseAutoIdentifiers(...)`는 지금 위치를 유지한다.
         FrontMatterReader의 파이프라인은 건드리지 마라. 이유: front matter만 읽고 HTML을 만들지 않는다.
      3. src/Loonaciaverse.Web/wwwroot/css/app.css의 `.prose` 규칙들 근처에 `.prose iframe.youtube` 규칙을 추가한다:
         `display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border: 0;`.
         scoped CSS(.razor.css)가 아니라 app.css에 둔다. 이유: 본문 HTML은 `MarkupString`으로 렌더되어 scoped CSS가 닿지 않는다.
      4. 테스트
         - tests/Loonaciaverse.ContentBuilder.Tests/MediaEmbedTests.cs: `ContentBuildRunner.Run`으로 글, 프로젝트, About을 빌드한 결과 JSON의 본문 HTML을 검증한다.
           watch?v= 형식과 youtu.be 형식이 모두 `src="https://www.youtube-nocookie.com/embed/{ID}"`와 `class="youtube"`가 있는 iframe이 되고,
           HTML 어디에도 `www.youtube.com/embed`가 없어야 한다. 글, 프로젝트, About 본문을 각각 하나 이상 검증한다.
           일반 상대 경로 이미지(`![alt](cover.png)`, 파일도 함께 만든다)는 여전히 `<img`로 남는지도 검증한다.
         - tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs: app.css의 `.prose iframe.youtube` 규칙에 `aspect-ratio: 16 / 9`가 있는지 검사하는 테스트를 추가한다.
           기존 `RootDefinesDesignColorTokenWithSpecifiedValue`처럼 정규식으로 규칙 본문을 찾는다.

      하지 마라:
      - Core의 콘텐츠 모델이나 JSON 스키마를 바꾸지 마라. 이유: 임베드는 본문 HTML 안의 변경만으로 충분하다.
      - Web(WASM)에서 런타임에 iframe을 고치지 마라. 이유: ADR-002, 변환은 빌드할 때만 한다.
      - content/의 샘플 글이나 프로젝트에 영상을 추가하지 마라. 이유: 실제 콘텐츠는 사이트 주인이 쓴다.
    expected_files:
      - tools/Loonaciaverse.ContentBuilder/MediaEmbeds.cs
      - tools/Loonaciaverse.ContentBuilder/PostBuilder.cs
      - tools/Loonaciaverse.ContentBuilder/ProjectBuilder.cs
      - tools/Loonaciaverse.ContentBuilder/AboutBuilder.cs
      - tests/Loonaciaverse.ContentBuilder.Tests/MediaEmbedTests.cs
      - src/Loonaciaverse.Web/wwwroot/css/app.css
      - tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs
    ac:
      - dotnet test

  - id: s2-og-tags
    title: add site-wide Open Graph tags with a placeholder image
    type: feat
    scope: web
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("횡단 관심사"의 SEO), docs/PRD.md ("범위 밖"의 글별 OG, "미정 값"), docs/ADR.md (ADR-001),
      src/Loonaciaverse.Web/wwwroot/index.html, content/site.yml, src/Loonaciaverse.Core/Content/Universe.cs (`SiteInfo`),
      tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs (AngleSharp로 index.html을 읽는 방식),
      tests/Loonaciaverse.Web.Tests/ContentBuildIntegrationTests.cs (`FindWebRoot`, 빌드된 JSON을 읽는 방식),
      tests/Loonaciaverse.Web.Tests/PageMetaTests.cs (런타임에 HeadContent로 넣는 메타).

      공유 미리보기 크롤러는 JS를 실행하지 않는다. 그래서 사이트 공통 OG 태그를 정적 index.html의 `<head>`에 둔다.

      1. src/Loonaciaverse.Web/wwwroot/index.html의 `<title>` 바로 다음에 다음 태그를 추가한다. 값은 지금 content/site.yml의 값을 그대로 적는다.
         - `<meta property="og:type" content="website" />`
         - `og:site_name`, `og:title`: site.yml `title`
         - `og:description`: site.yml `description`
         - `og:url`: `baseUrl` + `/`
         - `og:image`: `baseUrl` + `/og-image.png`, `og:image:width` `1200`, `og:image:height` `630`, `og:image:alt`: site.yml `title`
         - `og:locale`: `ko_KR`
         - `<meta name="twitter:card" content="summary_large_image" />`
         `<meta name="description">`과 `<link rel="canonical">`은 index.html에 넣지 마라. 이유: 페이지 컴포넌트가 HeadContent로 런타임에 넣으므로 중복된다.
      2. src/Loonaciaverse.Web/wwwroot/og-image.png: 1200×630 PNG 임시 이미지를 추가한다. 배경색 `#05070d` 단색이면 충분하다.
         사이트 주인이 나중에 같은 경로의 파일을 교체한다. 이미지를 만들 때 쓴 스크립트나 임시 파일은 저장소에 남기지 마라.
      3. tests/Loonaciaverse.Web.Tests/OpenGraphTests.cs
         - 빌드된 `wwwroot/content/universe.json`의 `Site`(`SiteInfo`)를 읽는다. index.html의 og:site_name, og:title, og:description, og:url, og:image, og:image:alt가
           그 값으로 계산한 기대값과 정확히 같은지 검증한다. baseUrl 끝에 `/`가 있든 없든 `/`가 한 번만 붙게 비교한다.
           이유: 도메인과 사이트 정보의 원천은 site.yml이다. 정적 index.html은 값을 직접 가질 수밖에 없으므로, 어긋나면 테스트가 알려 준다.
           실패 메시지에 "content/site.yml과 index.html의 OG 값을 함께 고친다"는 안내를 넣는다.
         - og:url과 og:image가 `https://`로 시작하는 절대 URL인지 검증한다.
         - og:image가 가리키는 파일이 wwwroot에 있고, PNG 시그니처가 맞고, IHDR의 너비와 높이가 1200×630인지 검증한다.
         - og:type, og:locale, twitter:card 값을 검증한다.
         HTML은 StaticAssetTests처럼 AngleSharp `HtmlParser`로 파싱한다.

      하지 마라:
      - 글별·페이지별 OG를 만들지 마라. 이유: PRD "범위 밖"이며 WASM Standalone의 한계다(ADR-001).
      - 빌드할 때 index.html을 생성하거나 MSBuild로 값을 치환하지 마라. 이유: .NET의 index.html 자산 치환(`#[.{fingerprint}]`, OverrideHtmlAssetPlaceholders)과 충돌할 위험이 있어서,
        값을 직접 쓰고 테스트로 일치를 검사하기로 정했다.
      - staticwebapp.config.json을 만들지 마라. 이유: 스텝 s3에서 한다.
    expected_files:
      - src/Loonaciaverse.Web/wwwroot/index.html
      - src/Loonaciaverse.Web/wwwroot/og-image.png
      - tests/Loonaciaverse.Web.Tests/OpenGraphTests.cs
    ac:
      - dotnet test

  - id: s3-swa-config
    title: add Static Web Apps fallback and content cache config
    type: feat
    scope: web
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("횡단 관심사"의 캐시와 SPA 라우팅, "CI/CD"), docs/ADR.md (ADR-006), docs/PRD.md ("7. 배포"),
      tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs와 ContentBuildIntegrationTests.cs (`FindWebRoot`).

      src/Loonaciaverse.Web/wwwroot/staticwebapp.config.json을 추가한다. Azure Static Web Apps는 업로드한 폴더 루트의 이 파일을 읽는데,
      배포 때 업로드하는 폴더가 publish 결과의 wwwroot다. 내용은 정확히 다음과 같다.
      ```json
      {
        "navigationFallback": {
          "rewrite": "/index.html",
          "exclude": ["/_framework/*", "/content/*", "/js/*", "/css/*", "/fonts/*", "*.{css,js,json,wasm,xml,txt,png,jpg,jpeg,gif,svg,webp,ico,woff2}"]
        },
        "routes": [
          { "route": "/content/*", "headers": { "Cache-Control": "no-cache" } }
        ]
      }
      ```
      - `navigationFallback`은 `/blog/{slug}` 같은 딥링크로 들어오거나 새로고침해도 Blazor가 라우팅하게 한다.
        `exclude`는 없는 정적 파일이 index.html 대신 진짜 404가 나게 한다.
      - `/content/*`의 `Cache-Control: no-cache`는 배포 직후 옛 콘텐츠 JSON이 보이지 않게 한다(ETag로 재검증).
      - 다른 키(`globalHeaders`, `mimeTypes`, `responseOverrides`, `auth` 등)를 추가하지 마라. 이유: 지금 필요하지 않고, 배포 전에는 효과를 확인할 수 없다.
      - www→루트 리다이렉트를 이 파일로 구현하지 마라. 이유: SWA 라우트는 호스트 이름으로 구분할 수 없다.
        Azure Portal의 사용자 지정 도메인 설정에서 처리하며, 스텝 s6에서 문서화한다.

      tests/Loonaciaverse.Web.Tests/StaticWebAppConfigTests.cs: `FindWebRoot()` 루트에 파일이 있는지 확인하고, System.Text.Json으로 읽어 다음을 검증한다.
      - `navigationFallback.rewrite`가 `/index.html`이다.
      - `exclude`에 위의 다섯 경로 접두사가 모두 있고, 확장자 패턴이 png, xml, json, wasm, woff2를 포함한다.
      - `/content/*` 라우트의 헤더에 `Cache-Control: no-cache`가 있다. 헤더 이름은 대소문자를 구분하지 않고 비교한다.

      하지 마라: GitHub Actions 워크플로나 다른 호스팅용 설정(GitHub Pages의 `404.html`, Cloudflare `_headers` 등)을 추가하지 마라.
      이유: 다른 호스팅 설정은 ADR-006이 금지하고, 워크플로는 스텝 s5에서 만든다.
    expected_files:
      - src/Loonaciaverse.Web/wwwroot/staticwebapp.config.json
      - tests/Loonaciaverse.Web.Tests/StaticWebAppConfigTests.cs
    ac:
      - dotnet test

  - id: s4-budget-check
    title: add home transfer budget check for published output
    type: build
    scope: budget
    description: |
      먼저 읽을 파일: docs/PRD.md ("제약"의 성능 예산), docs/ARCHITECTURE.md ("디렉토리 구조", "레이어 규칙", "CI/CD"), docs/ADR.md (ADR-004, ADR-005),
      Loonaciaverse.slnx, .gitignore, tools/Loonaciaverse.ContentBuilder/Program.cs (인자 처리와 종료 코드 패턴),
      tools/Loonaciaverse.ContentBuilder/Loonaciaverse.ContentBuilder.csproj, tests/Loonaciaverse.ContentBuilder.Tests/Loonaciaverse.ContentBuilder.Tests.csproj,
      tests/Loonaciaverse.ContentBuilder.Tests/TemporaryDirectory.cs, src/Loonaciaverse.Web/wwwroot/index.html,
      src/Loonaciaverse.Web/wwwroot/fonts/pretendard/pretendardvariable-dynamic-subset.css (`@font-face`마다 `src: url(...)`와 `unicode-range`가 있다).

      PRD 예산 "홈 첫 방문 전송량 3MB 이하(Brotli 기준, .NET 런타임, 앱 어셈블리, 씬 번들, 홈에서 쓰는 폰트 포함)"를
      `dotnet publish` 결과로 검사하는 콘솔 도구를 만든다. CI(스텝 s5)가 publish 직후에 실행한다.

      1. tools/Loonaciaverse.BudgetCheck/Loonaciaverse.BudgetCheck.csproj: OutputType Exe, net10.0, ImplicitUsings, Nullable.
         PackageReference와 ProjectReference를 두지 않는다. Core도 참조하지 않는다.
         이유: universe.json은 모델 없이 `JsonDocument`로 문자열 값만 훑으면 된다. 모델을 중복 정의하지 마라(ADR-004).
      2. tools/Loonaciaverse.BudgetCheck/HomeTransferBudget.cs
         - `public static class HomeTransferBudget`, `public const long LimitBytes = 3_000_000;`
           (PRD의 3MB를 보수적으로 10진 MB로 본다),
           `public static BudgetReport Measure(string webRoot)`.
         - `public sealed record BudgetEntry(string Path, long Bytes);`
           `public sealed record BudgetReport(IReadOnlyList<BudgetEntry> Entries, IReadOnlyList<string> MissingAssets)`에 `TotalBytes`, `IsWithinBudget`
           (빠진 자산이 없고 합계가 `LimitBytes` 이하) 속성을 둔다. `Path`는 webRoot 기준 상대 경로이고 구분자는 `/`다.
         - 집계 대상(홈 첫 방문에 받는 파일):
           1) `index.html`
           2) `_framework/` 아래 모든 파일. `.br`과 `.gz` 파일 자체는 원본의 압축본이므로 따로 세지 않는다.
           3) `css/app.css`, `Loonaciaverse.Web.styles.css`, `fonts/pretendard/pretendardvariable-dynamic-subset.css`
           4) `js/scene.js`. `js/highlight.js`, `js/toc.js`는 상세 페이지 전용이라 제외한다.
           5) `content/universe.json`. 홈은 이 파일만 fetch한다.
           6) `fonts/michroma/*.woff2`, `fonts/rajdhani/*.woff2`
           7) Pretendard subset 파일 가운데, `@font-face`의 `unicode-range`에 `content/universe.json`의 문자열 값에 나오는 코드 포인트가 하나라도 있는 파일.
              이유: Pretendard는 한글이 들어갈 수 있는 텍스트에만 쓰이고, dynamic subset이라 브라우저는 실제로 쓰인 글자 범위의 청크만 받는다.
              홈의 한글 텍스트(tagline, 최신 글·대표 프로젝트 제목 등)는 universe.json에서 온다.
              `unicode-range`는 `U+XXXX`와 `U+XXXX-YYYY` 형식을 지원한다. 코드 포인트는 `string.EnumerateRunes()`로 센다(서로게이트 쌍 대비).
              `src: url(...)` 경로는 CSS 파일 위치 기준으로 푼다.
         - 각 파일의 크기는 `<파일>.br`이 있으면 그 크기, 없으면 원본 크기다(Brotli 기준).
         - 필수 자산 `index.html`, `css/app.css`, `js/scene.js`, `content/universe.json`, Pretendard CSS가 없거나 `_framework/`에 `.wasm`이 하나도 없으면
           `MissingAssets`에 넣는다. 이유: 경로를 잘못 넘기면 합계가 0이 되어 검사가 저절로 통과하는 것을 막는다.
      3. tools/Loonaciaverse.BudgetCheck/Program.cs: `public static int Main(string[] args)`.
         사용법은 `Loonaciaverse.BudgetCheck <published-wwwroot>`다. 인자 수가 틀리거나 디렉터리가 없으면 사용법을 stderr에 쓰고 2를 반환한다.
         집계한 파일을 크기 내림차순으로 한 줄씩(바이트 수와 경로) stdout에 쓰고, 마지막 줄에 합계와 한도를 쓴다.
         예산 안이면 0, 빠진 자산이 있거나 예산을 넘으면 원인을 stderr에 쓰고 1을 반환한다.
      4. tests/Loonaciaverse.BudgetCheck.Tests/: csproj(ContentBuilder.Tests와 같은 패키지 구성, BudgetCheck 프로젝트 참조), TemporaryDirectory.cs(같은 패턴), HomeTransferBudgetTests.cs.
         임시 디렉터리에 가짜 publish 결과를 만들어 검증한다.
         - `.br`이 있으면 그 크기를 쓰고 원본 크기는 쓰지 않는다. `.br`과 `.gz`가 따로 세지지 않는다.
         - `js/highlight.js`, `js/toc.js`, `content/posts.json`, 홈과 무관한 파일이 빠진다.
         - Pretendard: `@font-face` 세 개(단일 코드 포인트 범위, 구간 범위, 쉼표로 이어진 여러 범위)를 가진 CSS와,
           그중 일부 범위의 글자만 든 universe.json으로 해당 청크만 세는지 검증한다. 중첩 객체와 배열 안의 문자열도 훑는지 검증한다.
         - 필수 자산이 빠지면 `MissingAssets`에 들어가고 `IsWithinBudget`이 false다.
         - 합계가 `LimitBytes`를 넘으면 `IsWithinBudget`이 false다(큰 파일을 만들기보다 `.br` 크기로 조절한다).
         - `Program.Main`의 종료 코드 0, 1, 2를 각각 검증한다.
      5. Loonaciaverse.slnx의 `/tools/` 폴더에 도구 프로젝트를, `/tests/` 폴더에 테스트 프로젝트를 추가한다.
      6. .gitignore에 `artifacts/`를 추가한다. 이유: 인수 조건과 CI가 publish 결과를 `artifacts/publish`에 쓴다.

      하지 마라:
      - Web csproj의 빌드 타깃에 예산 검사를 연결하지 마라. 이유: 예산 검사는 publish 결과를 대상으로 CI에서만 실행하며, 일반 빌드와 `dotnet watch`를 느리게 하면 안 된다.
      - PowerShell, bash, Node 스크립트로 만들지 마라. 이유: 집계 규칙을 xUnit으로 검증하기 위해 C# 도구로 정했다.
      - 예산을 통과시키려고 Web 앱, 폰트, 씬 번들을 바꾸지 마라. 실제 publish 결과가 예산을 넘으면 `blockers`에 측정값과 큰 파일 목록을 적는다.
      - GitHub Actions 워크플로를 만들지 마라. 이유: 스텝 s5에서 한다.
    expected_files:
      - tools/Loonaciaverse.BudgetCheck/Loonaciaverse.BudgetCheck.csproj
      - tools/Loonaciaverse.BudgetCheck/HomeTransferBudget.cs
      - tools/Loonaciaverse.BudgetCheck/Program.cs
      - tests/Loonaciaverse.BudgetCheck.Tests/Loonaciaverse.BudgetCheck.Tests.csproj
      - tests/Loonaciaverse.BudgetCheck.Tests/TemporaryDirectory.cs
      - tests/Loonaciaverse.BudgetCheck.Tests/HomeTransferBudgetTests.cs
      - Loonaciaverse.slnx
      - .gitignore
    ac:
      - dotnet test tests/Loonaciaverse.BudgetCheck.Tests
      - dotnet publish src/Loonaciaverse.Web -c Release -o artifacts/publish
      - dotnet run --project tools/Loonaciaverse.BudgetCheck -- artifacts/publish/wwwroot
      - dotnet test
    timeout_sec: 2400

  - id: s5-ci-workflow
    title: add GitHub Actions workflow for tests and SWA deploy
    type: ci
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("CI/CD"), docs/ADR.md (ADR-005, ADR-006), docs/PRD.md ("7. 배포"),
      global.json, scene/package.json, src/Loonaciaverse.Web/wwwroot/staticwebapp.config.json,
      tools/Loonaciaverse.BudgetCheck/Program.cs (사용법), .gitignore (`artifacts/`).

      .github/workflows/ci.yml 하나를 추가한다.
      - `name: CI`, 트리거는 `pull_request`(branches: main)와 `push`(branches: main). 최상위 `permissions: contents: read`.
      - job `test` (ubuntu-latest):
        `actions/checkout@v5` → `actions/setup-dotnet@v5`(`dotnet-version: "10.0.x"`) →
        `actions/setup-node@v5`(`node-version: 22`, `cache: npm`, `cache-dependency-path: scene/package-lock.json`) →
        `npm ci --prefix scene` → `dotnet test` → `npm test --prefix scene`.
        `dotnet-version`에 global.json 대신 `10.0.x`를 쓴다. 이유: global.json은 `10.0.100`에 `rollForward: latestFeature`라 10.0.x의 최신 SDK를 받아들인다.
      - job `deploy` (ubuntu-latest): `needs: test`, `if: github.event_name == 'push'`.
        test와 같은 checkout·dotnet·node 설정 → `npm ci --prefix scene` →
        `dotnet publish src/Loonaciaverse.Web -c Release -o artifacts/publish` →
        `dotnet run --project tools/Loonaciaverse.BudgetCheck -- artifacts/publish/wwwroot` →
        `Azure/static-web-apps-deploy@v1`(`azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}`, `action: upload`,
        `app_location: artifacts/publish/wwwroot`, `skip_app_build: true`).
        예산 검사가 실패하면 배포 단계로 가지 않아야 한다(기본 동작인 단계 실패로 충분하다).
      - 명령은 저장소의 인수 조건과 같은 형태로 쓴다. 이유: 로컬에서 같은 명령으로 재현할 수 있어야 한다.

      하지 마라:
      - PR에서 배포하거나 SWA PR 미리보기 환경, PR close 정리 job을 만들지 마라. 이유: ADR-006은 main 푸시에서만 배포하고 미리보기 환경을 쓰지 않는다.
      - 빌드 단계를 별도 스크립트(`build.ps1`, `build.sh` 등)로 쪼개지 마라. 이유: ADR-005.
      - Azure가 리소스를 만들 때 자동으로 추가하는 형태의 워크플로(`azure-static-web-apps-*.yml`, Oryx 빌드)를 쓰지 마라.
        이유: 빌드는 `dotnet publish`가 하고 SWA에는 결과만 올린다(`skip_app_build`).
      - 워크플로 파일 말고 다른 파일을 고치지 마라. 문서는 스텝 s6에서 고친다.
    expected_files:
      - .github/workflows/ci.yml
    ac:
      - uvx --from "actionlint-py==1.7.12.25" actionlint .github/workflows/ci.yml

  - id: s6-docs
    title: document deployment, Open Graph tags and media embeds
    type: docs
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md 전체, docs/PRD.md ("7. 배포", "미정 값"), docs/ADR.md (ADR-006),
      이 계획에서 만든 파일: .github/workflows/ci.yml, src/Loonaciaverse.Web/wwwroot/staticwebapp.config.json, src/Loonaciaverse.Web/wwwroot/index.html (OG 태그),
      tests/Loonaciaverse.Web.Tests/OpenGraphTests.cs, tools/Loonaciaverse.ContentBuilder/MediaEmbeds.cs,
      tools/Loonaciaverse.BudgetCheck/HomeTransferBudget.cs, tools/Loonaciaverse.BudgetCheck/Program.cs.

      문서를 실제 구현에 맞춘다. 이미 구현한 부분의 실제 방식만 고치거나 보충하고, 아직 구현하지 않은 설계는 지우지 마라
      (프리렌더링, Playground, 범위 밖 항목 등). 이유: ARCHITECTURE.md는 현재 상태가 아니라 목표 설계 문서이고, 이후 계획이 그 설계를 따른다.

      1. docs/ARCHITECTURE.md
         - "디렉토리 구조": `tools/Loonaciaverse.BudgetCheck/`(publish 결과의 홈 전송량 검사), `tests/Loonaciaverse.BudgetCheck.Tests/`(xUnit),
           `wwwroot/og-image.png`(기본 OG 이미지, 사이트 주인이 교체), `.github/workflows/ci.yml`, `artifacts/`(`[빌드 산출물]`, publish 결과)를 넣는다.
         - "콘텐츠 모델" 또는 "데이터 흐름"의 빌드 부분: 본문에 `![제목](https://www.youtube.com/watch?v=ID)`나 `https://youtu.be/ID`를 쓰면
           ContentBuilder가 youtube-nocookie.com iframe(`class="youtube"`)으로 바꾸고 app.css가 16:9로 맞춘다는 점.
         - "횡단 관심사"의 SEO: index.html의 공통 OG 태그 값은 site.yml의 title, description, baseUrl과 같아야 하고 `OpenGraphTests`가 일치를 검사한다는 점,
           og:image는 1200×630 PNG라는 점.
         - "테스트" 표: 전송량 예산 검사(집계 대상, `.br` 우선, Pretendard 청크 선택, 종료 코드) 행과 명령 `dotnet test`, Web 행에 OG 일치와 SWA 설정 검사를 보충한다.
         - "CI/CD": 실제 workflow 구조(`ci.yml`의 `test`, `deploy` job), 실행 명령, secret 이름 `AZURE_STATIC_WEB_APPS_API_TOKEN`,
           예산 검사의 집계 규칙 요약(한도 3,000,000바이트, 무엇을 세고 무엇을 빼는지)을 적는다.
           로컬 재현 방법도 적는다: `dotnet publish src/Loonaciaverse.Web -c Release -o artifacts/publish` 뒤 `dotnet run --project tools/Loonaciaverse.BudgetCheck -- artifacts/publish/wwwroot`.
           `artifacts/publish`에 이전 publish의 지문 붙은 파일이 남으면 합계가 부풀므로 로컬에서는 폴더를 지우고 다시 publish한다는 주의도 적는다.
         - "CI/CD" 끝에 "배포 준비(수동, 한 번)" 목록을 추가한다:
           1) GitHub 저장소를 만들고 push한다.
           2) Azure Static Web Apps Free 리소스를 만든다. 배포 소스는 "Other"로 골라 Azure가 저장소에 워크플로를 추가하지 않게 한다.
           3) 리소스의 배포 토큰을 저장소 secret `AZURE_STATIC_WEB_APPS_API_TOKEN`에 등록한다.
           4) 사용자 지정 도메인: 루트 도메인(DNS 업체의 ALIAS/ANAME 또는 Azure DNS)과 `www`(CNAME)를 추가하고, 루트 도메인을 기본 도메인으로 지정해 www가 루트로 리다이렉트되게 한다. HTTPS 인증서는 SWA가 발급한다.
           5) 배포 후 확인: 딥링크 새로고침, 없는 정적 파일의 404, `/content/*`의 `Cache-Control`, 공유 미리보기(OG), 브라우저 개발자 도구의 홈 전송량.
      2. docs/PRD.md "미정 값"의 도메인 항목에 예외를 한 문장 덧붙인다: index.html의 OG 태그는 정적이어야 해서 같은 값을 직접 쓰고, 테스트가 site.yml과의 일치를 검사한다.
         PRD의 다른 부분은 고치지 마라.
      3. docs/ADR.md와 docs/UX.md는 고치지 마라. 이유: 이 계획은 ADR 수준의 결정을 바꾸지 않고, UX 명세(YouTube 16:9, youtube-nocookie)는 이미 구현과 같다.
    expected_files:
      - docs/ARCHITECTURE.md
      - docs/PRD.md
    ac:
      - dotnet test
