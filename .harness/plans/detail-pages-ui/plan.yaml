  - id: s6-scene-highlight
    title: Add scene npm project and highlight code blocks with highlight.js
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("디렉토리 구조"의 scene/, "레이어 규칙", "데이터 흐름"의 빌드, "테스트"), docs/ADR.md (ADR-003, ADR-005),
      src/Loonaciaverse.Web/Loonaciaverse.Web.csproj (기존 ContentBuilder 타깃: PrepareContentBuild, BuildSiteContent, IncludeGeneratedSiteContent),
      src/Loonaciaverse.Web/Components/ContentBody.razor, tests/Loonaciaverse.Web.Tests/AboutTests.cs, .gitignore.

      1. `scene/` npm 프로젝트를 만든다. 이 스텝에서는 highlight.js만 다룬다.
         - `package.json`: `private: true`, `type: module`. scripts는 `build`가 `tsc --noEmit && vite build`, `test`가 `vitest run`이다.
           dependencies는 `highlight.js`, devDependencies는 `typescript`, `vite`, `vitest`, `happy-dom`. 모두 최신 안정 버전을 쓰고 `package-lock.json`을 커밋한다.
           `three`를 추가하지 마라. 이유: 3D 씬은 다른 계획에서 만든다.
         - `tsconfig.json`: `strict`, ES2022, `moduleResolution: bundler`, DOM lib, `noEmit`.
         - `vite.config.ts`: 라이브러리 모드, entry `{ highlight: "src/highlight.ts" }`, formats `["es"]`, 파일 이름 `[name].js`,
           `outDir`은 `../src/Loonaciaverse.Web/wwwroot/js`, `emptyOutDir: true`. Vitest 설정(`environment: "happy-dom"`)도 이 파일에 둔다.
           이유: 나중에 씬 진입점 `scene`을 같은 빌드의 entry로 추가한다.
         - `src/highlight.ts`: `highlight.js/lib/core`에 필요한 언어만 등록한다: csharp, cpp, typescript, javascript, json, xml, css, bash, powershell, yaml, glsl.
           전체 `highlight.js`를 import하지 마라. 이유: 전송량 예산(PRD).
           `export function highlightAll(root: HTMLElement): void`: `root` 안의 `pre code[class*="language-"]` 중 아직 하이라이트되지 않았고
           (`data-highlighted` 없음) 언어가 등록된 것만 `hljs.highlightElement`로 처리한다.
         - `src/highlight.test.ts`(Vitest): csharp 블록에 `hljs-keyword` span이 생긴다. 등록되지 않은 언어 블록은 그대로다.
           두 번 호출해도 결과가 같다. `root` 밖의 블록은 건드리지 않는다.
      2. `Loonaciaverse.Web.csproj`에 scene 빌드 타깃을 추가한다. ARCHITECTURE "데이터 흐름"의 빌드 규칙과 기존 ContentBuilder 타깃의 패턴을 따른다.
         - `scene/node_modules`가 없으면 `scene/`에서 `npm ci`를 먼저 실행한다.
         - `scene/`에서 `npm run build`를 `Exec`로 실행한다.
           Inputs는 `scene/src/**`, `package.json`, `package-lock.json`, `vite.config.ts`, `tsconfig.json`과 입력 목록 파일이다.
           Outputs는 `$(IntermediateOutputPath)scene-bundle.stamp`다.
           입력 목록 파일 `$(BaseIntermediateOutputPath)scene-bundle.inputs`로 파일 삭제도 감지한다.
           `wwwroot/js/highlight.js`가 없으면 stamp를 지워 다시 빌드한다.
         - 정적 웹 자산 수집(`ResolveProjectStaticWebAssets`) 전에 생성된 `wwwroot/js/**`를 `Content` 항목으로 다시 포함해, 첫 빌드와 publish에도 들어가게 한다.
         - design-time build에서는 실행하지 않는다. `<Watch Include="../../scene/src/**/*" />`를 추가한다.
         - 빌드 단계를 별도 스크립트(`build.ps1` 등)로 쪼개지 마라. 이유: ADR-005.
      3. `Components/ContentBody.razor`: `IJSRuntime`으로 `import("./js/highlight.js")` 모듈을 한 번 가져와 캐시한다.
         `OnAfterRenderAsync`에서 마지막으로 하이라이트한 뒤 `Html`이 바뀌었을 때만 `highlightAll(본문 div의 ElementReference)`을 호출한다.
         `JSException`이 나면 하이라이트 없이 둔다. 이유: 하이라이트가 없어도 본문은 읽을 수 있어야 한다.
         `IAsyncDisposable`로 모듈 참조를 해제한다.
         `SceneInterop`을 만들지 마라. 이유: SceneInterop은 3D 씬 전용이고 다른 계획에서 만든다.
      4. `wwwroot/css/app.css`: highlight.js 토큰 클래스(`.hljs-keyword`, `.hljs-string`, `.hljs-comment`, `.hljs-number`, `.hljs-title`, `.hljs-type` 등)에 색을 준다.
         기존 토큰으로 매핑하고, 새 색이 꼭 필요하면 `:root`에 `--color-code-` 접두사로 3개까지 추가한 뒤 decisions에 적는다.
         highlight.js 테마 CSS 파일을 가져오지 마라. 이유: UX.md는 테마를 토큰 색에 맞추라고 한다.
      5. 테스트:
         - `ContentBodyTests.cs`(bUnit, `JSInterop.SetupModule("./js/highlight.js")`):
           첫 렌더 뒤 `highlightAll`이 한 번 호출된다. 같은 Html로 다시 렌더링하면 호출되지 않는다. Html이 바뀌면 다시 호출된다.
           모듈 import가 `JSException`을 던져도 본문이 렌더링되고 예외가 밖으로 나가지 않는다.
         - `AboutTests.cs` 등 기존 테스트가 JS 호출 때문에 실패하면 JSInterop 설정만 추가한다. 검증 내용은 바꾸지 마라.
      6. 산출물이 `git status`에 보이면 `.gitignore`에 그 경로만 추가한다(`node_modules/`, `src/Loonaciaverse.Web/wwwroot/js/`는 이미 있다).

      docs/ARCHITECTURE.md를 고치지 마라. 이유: 이 스텝의 구현은 이미 문서에 적힌 설계를 따르고, 문서의 미구현 설계(scene.ts, SceneInterop 등)는 남아 있어야 한다.
    expected_files:
      - scene/package.json
      - scene/package-lock.json
      - scene/tsconfig.json
      - scene/vite.config.ts
      - scene/src/highlight.ts
      - scene/src/highlight.test.ts
      - src/Loonaciaverse.Web/Loonaciaverse.Web.csproj
      - src/Loonaciaverse.Web/Components/ContentBody.razor
      - src/Loonaciaverse.Web/wwwroot/css/app.css
      - tests/Loonaciaverse.Web.Tests/ContentBodyTests.cs
      - tests/Loonaciaverse.Web.Tests/AboutTests.cs
      - .gitignore
    ac:
      - dotnet build
      - dotnet test
      - npm test --prefix scene
    timeout_sec: 2400

