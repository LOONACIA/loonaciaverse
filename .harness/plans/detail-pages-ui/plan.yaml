  - id: s8-post-toc
    title: Add table of contents with heading scroll for blog posts
    description: |
      먼저 읽을 파일: docs/UX.md ("7. 페이지별"의 글 상세 목차), docs/ARCHITECTURE.md ("디렉토리 구조", "빌드 산출물"),
      src/Loonaciaverse.Core/Content/Posts.cs (`TocEntry`), src/Loonaciaverse.Web/Pages/BlogPost.razor, Components/ContentBody.razor (JS 모듈 사용 패턴),
      scene/vite.config.ts, scene/src/highlight.ts, scene/src/highlight.test.ts, src/Loonaciaverse.Web/Loonaciaverse.Web.csproj (scene 빌드 타깃).

      배경: 목차 항목의 id는 한글이다(예: `나만의-우주를-시작하며`). Blazor 10의 같은 페이지 해시 링크 처리는 퍼센트 인코딩된 fragment로
      `document.getElementById`를 호출한다(blazor.webassembly.js 10.0.13에서 확인). 그래서 일반 `<a href="#한글">`로는 스크롤되지 않는다.
      목차 클릭은 JS 함수로 스크롤한다.

      1. `scene/src/toc.ts`: `export function scrollToHeading(id: string): void`.
         `document.getElementById(id)`를 찾아 `scrollIntoView({ block: "start" })`를 호출한다.
         `prefers-reduced-motion: reduce`가 아니면 `behavior: "smooth"`를 쓴다. 요소가 없으면 아무것도 하지 않는다.
         URL이나 history를 바꾸지 마라. 이유: Blazor NavigationManager의 상태와 어긋난다.
      2. `scene/src/toc.test.ts`: 한글 id 요소의 `scrollIntoView`가 호출된다(mock). 없는 id는 예외 없이 무시된다. reduced-motion이면 smooth가 아니다.
      3. `scene/vite.config.ts`에 entry `toc: "src/toc.ts"`를 추가한다. 출력은 `wwwroot/js/toc.js`다.
         `Loonaciaverse.Web.csproj`의 scene 빌드 타깃에서, `wwwroot/js/toc.js`가 없을 때도 다시 빌드하도록 필수 산출물 검사에 넣는다.
      4. `Components/TableOfContents.razor`(+ `.razor.css`): 파라미터 `Entries`(`IReadOnlyList<TocEntry>`). 비어 있으면 아무것도 렌더링하지 않는다.
         - 각 링크의 href는 현재 경로(query, fragment 제외) + `#` + `Uri.EscapeDataString(id)`다.
           클릭하면 `@onclick:preventDefault`로 기본 이동을 막고, `./js/toc.js` 모듈의 `scrollToHeading`을 원래 id로 호출한다.
           href는 새 탭 열기와 링크 복사를 위해 남긴다.
           모듈은 한 번만 import해 캐시하고 `IAsyncDisposable`로 해제한다. `JSException`은 무시한다.
         - level 3 항목은 `toc-level-3` 클래스로 들여쓴다. 텍스트는 `TocEntry.Text`를 그대로 출력한다(Blazor가 이스케이프한다).
         - 같은 항목 목록으로 두 가지를 렌더링한다:
           모바일용 `<details class="toc toc-mobile"><summary>CONTENTS</summary>…</details>`(본문 위, 접이식)와
           데스크톱용 `<nav class="toc toc-desktop" aria-label="CONTENTS">`(오른쪽 sticky). CSS 미디어 쿼리로 하나만 보이게 한다.
      5. `Pages/BlogPost.razor`(+ `.razor.css`): 본문 영역을 데스크톱에서는 본문 + 오른쪽 sticky 목차의 2열로, 모바일에서는 목차를 본문 위에 두도록 배치한다.
      6. docs/ARCHITECTURE.md는 다음 두 곳에 줄을 추가하거나 덧붙이기만 한다:
