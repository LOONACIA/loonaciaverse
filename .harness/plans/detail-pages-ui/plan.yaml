  - id: s10-page-meta
    title: Set page title, description and canonical from site info
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("횡단 관심사"의 SEO, 에러 처리의 soft 404), docs/ADR.md (ADR-001 트레이드오프),
      src/Loonaciaverse.Core/Content/Universe.cs (`SiteInfo`), src/Loonaciaverse.Web/Layout/PageLayout.razor (Universe cascading),
      `src/Loonaciaverse.Web/Pages/`의 모든 페이지, Components/LostInSpace.razor, Program.cs (HeadOutlet 등록).

      1. `Components/PageMeta.razor`: 파라미터 `Title`(string?), `Description`(string?), `NoIndex`(bool). `[CascadingParameter] Universe?`를 쓴다.
         - Universe가 있으면 다음을 렌더링한다:
           - `<PageTitle>`: `Title`이 있으면 `{Title} · {Site.Title}`, 없으면 `Site.Title`
           - `<HeadContent>` 안의 `<meta name="description">`: `Description ?? Site.Description`
           - `<link rel="canonical">`: `Site.BaseUrl`(끝 `/` 제거) + 현재 경로. 현재 경로는 `NavigationManager` 기준이고 query, fragment를 뗀다.
         - `NoIndex`이면 canonical 대신 `<meta name="robots" content="noindex">`를 둔다. 이유: SWA 대체 경로 때문에 404가 HTTP 200(soft 404)이라 검색 색인에서 빼야 한다.
         - Universe가 null이면(로드 중, 실패) `Title`이 있을 때만 `<PageTitle>{Title}</PageTitle>`을 렌더링한다.
         - 사이트 제목이나 도메인을 코드에 하드코딩하지 마라. 이유: 값은 `content/site.yml` 한 곳에만 둔다(PRD "미정 값").
      2. 모든 페이지의 `<PageTitle>`을 `PageMeta`로 바꾼다. 화면에 동시에 `PageMeta`가 하나만 있도록 로드 성공 분기 안에 둔다.
         | 페이지 | Title | Description |
         |---|---|---|
         | About | `ABOUT` | 기본값 |
         | BlogList | `BLOG` / `{tag} · BLOG` | 기본값 |
         | BlogPost | 글 제목 | 글 요약 |
         | ProjectList | `PROJECTS` | 기본값 |
         | ProjectDetail | 제목 | 요약 |
         - `LostInSpace` 컴포넌트 자체가 `<PageMeta Title="LOST IN SPACE" NoIndex="true" />`를 렌더링한다. `NotFound` 페이지는 `<LostInSpace />`만 렌더링한다.
           이유: 없는 라우트와 없는 slug 모두 같은 noindex 처리를 받는다.
      3. 테스트:
         - `PageMetaTests.cs`: `HeadOutlet`과 함께 렌더링해 title 형식, description 기본값과 지정값, canonical(query 제외), NoIndex일 때 robots meta가 있고 canonical이 없음, Universe null일 때 동작을 검증한다.
         - 기존 페이지 테스트는 PageTitle 문자열을 검증하던 부분이 있으면 새 형식에 맞춘다. 다른 검증은 약화하지 마라.
         - LostInSpace를 렌더링하는 경로(없는 slug, NotFound)에 noindex가 붙는지 한 곳 이상에서 검증한다.

      Open Graph 태그를 페이지별로 추가하지 마라. 이유: PRD가 글별 OG를 범위 밖으로 정했다(ADR-001).
    expected_files:
      - src/Loonaciaverse.Web/Components/PageMeta.razor
      - src/Loonaciaverse.Web/Components/LostInSpace.razor*
      - src/Loonaciaverse.Web/Pages/*.razor
      - tests/Loonaciaverse.Web.Tests/*Tests.cs
    ac:
      - dotnet build
      - dotnet test
      - npm test --prefix scene
