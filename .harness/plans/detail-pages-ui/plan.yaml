id: detail-pages-ui
goal: >
  Loonaciaverse의 상세 페이지 UI를 만든다. 완료 상태는 다음과 같다.
  다크 테마 디자인 토큰과 자체 호스팅 폰트(Michroma, Rajdhani, Pretendard)가 적용된다.
  모든 상세 페이지에 HUD형 상단 바가 있다.
  `/blog`, `/blog/tags/{tag}`, `/blog/{slug}`(목차, highlight.js 코드 하이라이트), `/projects`, `/projects/{slug}`, `/about`,
  테마형 404(LOST IN SPACE)가 `IContentService`로 콘텐츠를 읽어 렌더링된다.
  콘텐츠 로드 실패는 SIGNAL LOST와 RETRY로, 없는 slug는 LOST IN SPACE로 처리한다.
  페이지별 title, description, canonical은 `site.yml` 값으로 설정된다.
  highlight.js를 번들링하는 `scene/` npm 프로젝트(TypeScript, Vite, Vitest)와 그 MSBuild 빌드 타깃도 이 계획에서 만든다.
  모든 동작은 bUnit, Vitest 테스트로 검증한다.
  3D 메인 화면, Three.js 코드, 목록형 홈, 부팅 화면, CI/CD 배포는 이 계획의 범위가 아니다.
approved: true
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-theme-fonts
    title: Add design tokens, self-hosted fonts and base styles
    description: |
      먼저 읽을 파일: docs/UX.md ("6. 상세 페이지 공통", "8. 디자인 토큰"), docs/ARCHITECTURE.md ("디렉토리 구조", "횡단 관심사"의 폰트·에러 처리 항목),
      src/Loonaciaverse.Web/wwwroot/index.html, tests/Loonaciaverse.Web.Tests/ContentBuildIntegrationTests.cs.

      1. 폰트를 `src/Loonaciaverse.Web/wwwroot/fonts/`에 자체 호스팅한다. 이 파일들은 커밋되는 정적 자산이다(빌드 산출물이 아니다).
         - Pretendard: 공식 npm 패키지 `pretendard`(최신 1.3.x)의 `dist/web/variable/pretendardvariable-dynamic-subset.css`와
           `dist/web/variable/woff2-dynamic-subset/` 폴더 전체를 `wwwroot/fonts/pretendard/` 아래에 같은 상대 구조로 복사한다.
           CSS 안의 상대 경로 `url(...)`이 그대로 맞아야 한다. 폰트 패밀리 이름은 `Pretendard Variable`이다.
         - Michroma 400, Rajdhani 400/500/600/700: npm 패키지 `@fontsource/michroma`, `@fontsource/rajdhani`의 latin woff2 파일을
           `wwwroot/fonts/michroma/`, `wwwroot/fonts/rajdhani/`에 복사한다.
         - 각 폰트의 라이선스 파일(OFL)을 해당 폴더에 함께 둔다.
         - 패키지는 저장소 밖 임시 디렉토리에서 받는다(`npm pack` 후 `tar`로 풀기 등). 저장소에 package.json, node_modules, 압축 파일을 남기지 마라.
           이유: ARCHITECTURE가 폰트를 `wwwroot/fonts/`의 정적 파일로 정했고, npm 프로젝트는 s6에서 `scene/`에만 만든다.
      2. `wwwroot/css/app.css`를 만든다.
         - 맨 위에 Michroma와 Rajdhani의 `@font-face`를 둔다(`font-display: swap`, woff2만).
         - `:root`에 UX.md 8절의 토큰을 표의 이름과 값 그대로 한 벌만 둔다. 폰트 토큰에는 대체 폰트를 붙인다.
           예: `--font-body: "Pretendard Variable", Pretendard, system-ui, sans-serif`. `color-scheme: dark`도 둔다.
           라이트 모드용 토큰이나 `prefers-color-scheme` 분기를 만들지 마라. 이유: PRD가 라이트 모드를 범위 밖으로 정했다.
         - 기본 스타일: `box-sizing`, `html, body`의 배경 `--color-bg`, 글자색 `--color-text`, 본문 폰트 `--font-body`, 링크 색 `--color-hud`,
           `:focus-visible` 외곽선(`--color-hud`).
         - 이후 스텝이 쓸 공용 유틸리티 클래스:
           `.hud-label`: `--font-hud`, 대문자, `letter-spacing: 0.12em`, `--color-hud`.
           `.hud-frame`: 1px `--color-hud-dim` 테두리에 모서리 브래킷.
           `.chip`: 스택, 태그 칩. 한글이 들어갈 수 있으니 `--font-body`.
           `.badge`, `.badge-draft`(`--color-locked`), `.badge-featured`(`--color-hud`).
         - `#blazor-error-ui`: 평소에는 `display: none`이다(Blazor가 오류 때 표시한다). 테마에 맞게 스타일만 바꾼다(`--color-surface` 배경, `--color-danger` 강조).
      3. `wwwroot/index.html`:
         - `<html lang="ko">`로 바꾼다. 이유: 콘텐츠가 한국어다.
         - `<head>`에 Pretendard CSS와 `css/app.css`를 `<link rel="stylesheet">`로 연결한다. 기존 `blazor.webassembly` 스크립트처럼 `#[.{fingerprint}]` 자리표시자를 써도 된다.
         - `<body>`에 Blazor 기본 `#blazor-error-ui` 마크업을 추가한다: `An unhandled error has occurred.`, `<a href="." class="reload">Reload</a>`, `<span class="dismiss">🗙</span>`.
         - `<div id="app">Loading...</div>`와 부팅 화면은 바꾸지 마라. 이유: 부팅 화면은 다른 계획에서 만든다.
      4. 테스트 `tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs`(xUnit):
         - `ContentBuildIntegrationTests.FindWebRoot`를 `internal static`으로 바꿔 재사용한다. 그 파일의 다른 부분은 고치지 마라.
         - `app.css`와 Pretendard CSS의 모든 상대 경로 `url(...)`이 `wwwroot` 안의 실제 파일을 가리킨다.
         - `index.html`이 위 두 스타일시트를 연결한다(fingerprint 자리표시자는 떼고 비교). 연결된 파일이 실제로 있다.
         - `app.css`의 `:root`에 UX.md 8절의 색 토큰 8개가 표의 값 그대로 정의되어 있다.

      Razor 컴포넌트, 레이아웃, 페이지를 만들거나 고치지 마라. 이유: s2부터 만든다.
    expected_files:
      - src/Loonaciaverse.Web/wwwroot/index.html
      - src/Loonaciaverse.Web/wwwroot/css/app.css
      - src/Loonaciaverse.Web/wwwroot/fonts/*
      - tests/Loonaciaverse.Web.Tests/StaticAssetTests.cs
      - tests/Loonaciaverse.Web.Tests/ContentBuildIntegrationTests.cs
    ac:
      - dotnet build
      - dotnet test
    timeout_sec: 2400

  - id: s2-page-layout-404
    title: Add page layout with HUD top bar and themed 404
    description: |
      먼저 읽을 파일: docs/UX.md ("6. 상세 페이지 공통"의 상단 바와 톤, "7. 페이지별"의 404, "10. HUD 카피"), docs/ADR.md (ADR-003),
      src/Loonaciaverse.Web/App.razor, Layout/MainLayout.razor, Pages/NotFound.razor, _Imports.razor, wwwroot/css/app.css, wwwroot/index.html,
      tests/Loonaciaverse.Web.Tests/HomeTests.cs (bUnit 사용 방식).

      1. `src/Loonaciaverse.Web/Layout/PageLayout.razor`(+ `PageLayout.razor.css`): 상세 페이지 공통 레이아웃.
         `@inherits LayoutComponentBase`이고, `<TopBar />`와 `<main>@Body</main>`을 렌더링한다.
         배경은 `--color-bg` 위에 정적인 CSS 별 점 몇 겹(radial-gradient 레이어)을 둔다. 애니메이션, canvas, 3D를 쓰지 마라. 이유: UX.md 6절.
         `MainLayout`과 `App.razor`는 고치지 마라. 이유: Home은 3D 화면이 될 페이지라 상단 바 없이 `MainLayout`을 계속 쓴다.
      2. `Components/TopBar.razor`(+ `.razor.css`):
         - 현재 섹션은 `NavigationManager`의 base 기준 상대 경로에서 query와 fragment를 뗀 뒤 첫 세그먼트로 정한다:
           `projects` | `blog` | `about`, 그 밖은 섹션 없음.
           `LocationChanged`를 구독해 다시 렌더링하고, `IDisposable`로 구독을 해제한다. 이유: 레이아웃 인스턴스는 페이지 이동 사이에 재사용된다.
         - 왼쪽 로고 `<a>`(`LOONACIAVERSE`, `--font-display`): href는 섹션이 있으면 `/?focus={섹션}`, 없으면 `/`.
         - 오른쪽 `<nav>`: `PROJECTS`(`/projects`), `BLOG`(`/blog`), `ABOUT`(`/about`). 현재 섹션 링크에는 `class="active"`와 `aria-current="page"`를 붙이고 HUD 색 밑줄로 표시한다.
         - 섹션이 `blog`일 때만 RSS 링크를 더한다: `<a href="/feed.xml" target="_top" aria-label="RSS">`와 인라인 SVG 아이콘(`aria-hidden="true"`).
           `target="_top"`을 빼지 마라. 이유: target이 없으면 Blazor가 링크를 가로채 `/feed.xml`을 라우트로 처리해 404 화면이 나온다.
           blazor.webassembly.js는 target이 없거나 `_self`인 링크만 가로챈다.
         - 모바일에서도 같은 구성을 축소해서 쓴다. 햄버거 메뉴를 만들지 마라. 이유: UX.md 6절.
      3. `Components/LostInSpace.razor`(+ `.razor.css`): `<h1>LOST IN SPACE</h1>`, 한국어 안내 `요청한 좌표에서 아무 신호도 찾지 못했습니다.`,
         `<a href="/">RETURN TO ORBIT</a>`(HUD 버튼 모양). s4에서 없는 slug에도 재사용한다.
      4. `Pages/NotFound.razor`: `@page "/not-found"`는 유지하고 `@layout PageLayout`으로 바꾼다.
         `<PageTitle>LOST IN SPACE · LOONACIAVERSE</PageTitle>`와 `<LostInSpace />`만 렌더링한다.
      5. `_Imports.razor`에 `@using Loonaciaverse.Web.Components`를 추가한다.
      6. `index.html`에 CSS 격리 번들(`Loonaciaverse.Web.styles.css`, 템플릿 관례대로 fingerprint 자리표시자 사용 가능) 링크를 `app.css` 뒤에 추가한다.
         공용 스타일이 더 필요하면 `app.css`에 추가한다.
      7. 테스트(bUnit, `BunitContext`, 탐색은 `NavigationManager.NavigateTo`):
         - `TopBarTests.cs`: `/blog/x` → 로고 href `/?focus=blog`. `/projects` → `/?focus=projects`. `/about` → `/?focus=about`.
           `/not-found` → `/`. 현재 섹션 링크만 `aria-current="page"`다. RSS 링크는 블로그 섹션에서만 있고 `target="_top"`이다.
           렌더링 뒤 `NavigateTo`로 섹션이 바뀌면 로고와 활성 링크가 갱신된다.
         - `NotFoundTests.cs`: h1 텍스트 `LOST IN SPACE`, 한국어 안내, `RETURN TO ORBIT` 링크 href `/`.

      HUD 영어 라벨은 UX.md 10절 카피와 위에 적은 것만 쓴다. 블로그, 프로젝트, About 페이지를 만들지 마라. 이유: s3 이후에 만든다.
    expected_files:
      - src/Loonaciaverse.Web/Layout/PageLayout.razor*
      - src/Loonaciaverse.Web/Components/TopBar.razor*
      - src/Loonaciaverse.Web/Components/LostInSpace.razor*
      - src/Loonaciaverse.Web/Pages/NotFound.razor
      - src/Loonaciaverse.Web/_Imports.razor
      - src/Loonaciaverse.Web/wwwroot/index.html
      - src/Loonaciaverse.Web/wwwroot/css/app.css
      - tests/Loonaciaverse.Web.Tests/TopBarTests.cs
      - tests/Loonaciaverse.Web.Tests/NotFoundTests.cs
    ac:
      - dotnet build
      - dotnet test

  - id: s3-about-page
    title: Render About page through content loader and page header
    description: |
      먼저 읽을 파일: docs/UX.md ("6. 상세 페이지 공통"의 페이지 헤더·본문·폰트 규칙, "7. 페이지별"의 About), docs/ARCHITECTURE.md ("레이어 규칙", "데이터 흐름"의 런타임: 상세),
      src/Loonaciaverse.Core/Content/About.cs, Universe.cs, IContentService.cs, src/Loonaciaverse.Web/Layout/PageLayout.razor,
      src/Loonaciaverse.Web/wwwroot/css/app.css, tests/Loonaciaverse.Web.Tests/HttpContentServiceTests.cs (모델 생성 예시).

      1. `PageLayout`이 `IContentService.GetUniverseAsync`를 `OnInitializedAsync`에서 한 번 호출한다.
         결과(`Universe?`)를 `<CascadingValue Value="universe">`로 `@Body`에 내려준다.
         로드 중이거나 실패하면 null이다. 실패해도 예외를 밖으로 던지지 말고 페이지는 그대로 렌더링한다(취소 예외 제외).
         이유: 세계관 이름은 헤더 라벨에만 쓰이므로 페이지 본문을 막으면 안 된다.
         `CancellationTokenSource`를 두고 Dispose 때 취소한다.
      2. `Components/PageHeader.razor`(+ `.razor.css` 선택): 파라미터 `BodyId`(string), `Title`(string), `ChildContent`(RenderFragment?, 제목 아래 메타 영역).
         `[CascadingParameter] Universe?`에서 `Id == BodyId`인 천체의 `Name`을 작은 `.hud-label`로 보여 주고, 그 아래 `<h1>{Title}</h1>`을 둔다.
         Universe가 null이면 라벨을 렌더링하지 않는다. 세계관 이름을 코드에 하드코딩하지 마라. 이유: 이름은 `content/universe.yml`에서 바뀐다.
      3. `Components/ContentLoader.razor`: `@typeparam TItem where TItem : class`.
         파라미터는 `Load`(`Func<CancellationToken, Task<TItem?>>`, 필수)와 `ChildContent`(`RenderFragment<TItem>`, 필수)다.
         `OnInitializedAsync`에서 Load를 호출한다. 로드 중에는 `<div class="content-loading" aria-busy="true"></div>`, 완료되면 `ChildContent(item)`를 렌더링한다.
         Dispose 때 토큰을 취소한다. 파라미터가 바뀌어도 다시 로드하지 않는다. 다시 로드해야 하는 페이지는 `@key`로 컴포넌트를 새로 만든다.
         예외 처리와 null 결과 처리는 하지 마라(null이면 아무것도 렌더링하지 않는다). 이유: s4에서 SIGNAL LOST, LOST IN SPACE와 함께 테스트로 추가한다.
      4. `Components/ContentBody.razor`: 파라미터 `Html`(string). `<div class="prose">@((MarkupString)Html)</div>`.
         JS 호출을 넣지 마라. 이유: highlight.js는 s6에서 붙인다.
      5. `wwwroot/css/app.css`에 `.prose` 스타일을 추가한다. MarkupString 안의 요소에는 CSS 격리가 적용되지 않으므로 전역 CSS에 둔다.
         - 최대 폭 72ch, 줄 간격 1.75, `--font-body`.
         - h2·h3, 문단, 목록, 인용, 표, 인라인 코드, `pre`(`--color-surface` 배경, 가로 스크롤).
         - `img`는 본문 폭에 맞춘다(`max-width: 100%; height: auto`).
         - `iframe`은 폭 100%, `aspect-ratio: 16 / 9`, 테두리 없음. 이유: YouTube 반응형 임베드(UX.md 6절).
      6. `Pages/About.razor`(+ `.razor.css`): `@page "/about"`, `@layout PageLayout`, `<PageTitle>ABOUT · LOONACIAVERSE</PageTitle>`.
         `ContentLoader`로 `GetAboutAsync`를 부른다. 이 순서로 렌더링한다:
         - `PageHeader`(`BodyId="about"`, `Title`=프로필 `Name`)
         - 직함 `Title`
         - 스택 칩(`<ul>`, `.chip`, 값을 그대로 출력)
         - `ContentBody`(본문 HTML)
         - `COMMS` 섹션(`.hud-label` 제목): `EMAIL`(`mailto:{email}`), `GITHUB`, `LINKEDIN` 링크. GitHub, LinkedIn은 값이 null이면 렌더링하지 않는다.
           외부 링크에는 `target="_blank" rel="noopener noreferrer"`를 붙인다.
         페이지가 `HttpClient`를 직접 쓰지 마라. 이유: ADR-004, 콘텐츠는 `IContentService`로만 읽는다.
      7. `_Imports.razor`에 필요한 `@using`(예: `Loonaciaverse.Core.Content`)을 추가한다.
      8. 테스트:
         - `FakeContentService.cs`: `IContentService` 구현. 메서드마다 테스트가 바꿀 수 있는 `Func` 속성과 호출 기록을 둔다. 설정하지 않은 메서드는 `InvalidOperationException`을 던진다.
         - `TestContent.cs`: 테스트용 샘플 `Universe`(천체 4개, UX.md 4.1의 id·이름), `AboutProfile` 등을 만드는 정적 헬퍼.
         - `AboutTests.cs`: 이름 h1, 직함, 스택 칩, 본문 HTML, mailto 링크, GitHub/LinkedIn 링크(null이면 없음).
           `CascadingValue<Universe>`로 감싸면 헤더 라벨에 about 천체 이름이 보인다.
         - `PageLayoutTests.cs`: `Body`로 `PageHeader`를 넣어 렌더링하면 가짜 서비스의 Universe에서 천체 이름 라벨이 보인다.
           `GetUniverseAsync`가 예외를 던져도 Body가 렌더링되고 라벨만 없다.

      블로그, 프로젝트 페이지를 만들지 마라. 이유: s5, s7, s9에서 만든다.
    expected_files:
      - src/Loonaciaverse.Web/Layout/PageLayout.razor*
      - src/Loonaciaverse.Web/Components/PageHeader.razor*
      - src/Loonaciaverse.Web/Components/ContentLoader.razor
      - src/Loonaciaverse.Web/Components/ContentBody.razor
      - src/Loonaciaverse.Web/Pages/About.razor*
      - src/Loonaciaverse.Web/_Imports.razor
      - src/Loonaciaverse.Web/wwwroot/css/app.css
      - tests/Loonaciaverse.Web.Tests/FakeContentService.cs
      - tests/Loonaciaverse.Web.Tests/TestContent.cs
      - tests/Loonaciaverse.Web.Tests/AboutTests.cs
      - tests/Loonaciaverse.Web.Tests/PageLayoutTests.cs
    ac:
      - dotnet build
      - dotnet test

  - id: s4-content-errors
    title: Show SIGNAL LOST with retry and LOST IN SPACE for missing content
    description: |
      먼저 읽을 파일: docs/ARCHITECTURE.md ("횡단 관심사"의 에러 처리), docs/UX.md ("7. 페이지별"의 콘텐츠 로드 실패, "10. HUD 카피"),
      src/Loonaciaverse.Web/Components/ContentLoader.razor, LostInSpace.razor, Pages/About.razor,
      tests/Loonaciaverse.Web.Tests/FakeContentService.cs, AboutTests.cs.

      1. `Components/SignalLost.razor`(+ `.razor.css`): `role="alert"` 영역에 `SIGNAL LOST`(`.hud-label`, `--color-danger`),
         한국어 안내 `콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.`, `<button type="button">RETRY</button>`을 둔다.
         파라미터 `OnRetry`(EventCallback)를 받는다.
      2. `ContentLoader`를 확장한다:
         - Load가 `OperationCanceledException` 외의 예외를 던지면 `<SignalLost>`를 보여 준다. RETRY를 누르면 로드 중 상태로 돌아가 Load를 다시 호출한다.
         - Load가 null을 반환하면 `NotFound` 파라미터(RenderFragment?)를 렌더링하고, 없으면 `<LostInSpace />`를 렌더링한다.
         - 컴포넌트가 Dispose된 뒤 끝난 Load의 결과나 예외는 무시한다. 취소 예외는 SIGNAL LOST로 표시하지 않는다.
         - 예외를 삼키기만 하고 아무것도 보여 주지 않는 경로를 만들지 마라.
      3. 테스트:
         - `ContentLoaderTests.cs`: 로드 중 `aria-busy` 표시, 성공 시 ChildContent, 예외 시 `SIGNAL LOST`와 RETRY 버튼,
           RETRY 후 성공하면 내용이 보이고 Load 호출이 2회, null이면 `LOST IN SPACE`, `NotFound` 파라미터가 있으면 그것을 렌더링,
           Dispose하면 Load에 넘긴 토큰이 취소된다.
         - `AboutTests.cs`: `GetAboutAsync`가 `HttpRequestException`을 던지면 `SIGNAL LOST`가 보인다.

      `HttpContentService`를 고치지 마라. 이유: 실패는 이미 예외로 전달되고(없는 상세는 null), 표시는 UI 책임이다.
    expected_files:
      - src/Loonaciaverse.Web/Components/ContentLoader.razor
      - src/Loonaciaverse.Web/Components/SignalLost.razor*
      - tests/Loonaciaverse.Web.Tests/ContentLoaderTests.cs
      - tests/Loonaciaverse.Web.Tests/AboutTests.cs
      - tests/Loonaciaverse.Web.Tests/FakeContentService.cs
      - tests/Loonaciaverse.Web.Tests/TestContent.cs
    ac:
      - dotnet build
      - dotnet test

