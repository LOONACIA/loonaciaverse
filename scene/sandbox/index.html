<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loonaciaverse scene sandbox</title>
    <style>
      html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
      #scene { color: #e6eef7; font-family: sans-serif; }
      #controls { position: fixed; z-index: 1; top: 1rem; left: 1rem; max-height: calc(100% - 2rem); overflow: auto; padding: 0.75rem; color: #e6eef7; background: rgba(11, 18, 32, 0.9); font: 14px sans-serif; }
      #controls > div { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; }
      button { color: #5fd4ff; background: #05070d; border: 1px solid #5fd4ff; padding: 0.4rem; cursor: pointer; }
      label { display: inline-flex; gap: 0.25rem; align-items: center; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <aside id="controls" aria-label="Scene controls">
      <div><button id="clear" type="button">CLEAR</button><label><input id="immediate" type="checkbox" /> immediate</label></div>
      <div id="body-controls" style="display: block"></div>
    </aside>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
